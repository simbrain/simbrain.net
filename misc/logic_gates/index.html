<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural network logic gate homework</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0; padding: 2rem 1rem; }
    main { margin: 0 auto; max-width: 42rem; }
    h1 { font-size: 1.5rem; }
    label { display: block; margin-bottom: .4rem; }
    .input-row { display: flex; }
    input { border: 1px solid #767676; border-radius: .25rem 0 0 .25rem; flex: 1; font: inherit; min-width: 0; padding: .5rem .7rem; }
    button { background: #0d6efd; border: 1px solid #0d6efd; border-radius: 0 .25rem .25rem 0; color: white; cursor: pointer; font: inherit; padding: .5rem .8rem; }
    .error { color: #b02a37; margin-top: .35rem; }
    .logic-expression { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 1.25rem; font-weight: 600; overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Neural network logic gate homework</h1>

  <form id="student-id-form" novalidate>
    <label for="student-id">Student id</label>
    <div class="input-row">
      <input id="student-id" name="student-id" type="text" inputmode="numeric" autocomplete="off" required>
      <button type="submit">Generate</button>
    </div>
    <div class="error hidden" id="student-id-error">Please enter a student ID.</div>
  </form>

  <p id="expression" class="logic-expression hidden" aria-live="polite"></p>
</main>

<script>
  (() => {
    const form = document.getElementById('student-id-form');
    const input = document.getElementById('student-id');
    const error = document.getElementById('student-id-error');
    const expressionElement = document.getElementById('expression');

    // A small deterministic hash keeps this entirely static while making each
    // student ID produce the same result whenever the page is reopened.
    function hashId(value) {
      let hash = 2166136261;
      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function seededRandom(seed) {
      let state = seed;
      return () => {
        state += 0x6D2B79F5;
        let value = state;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    function choose(random, values) {
      return values[Math.floor(random() * values.length)];
    }

    function shuffledLetters(random) {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      for (let index = letters.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(random() * (index + 1));
        [letters[index], letters[swapIndex]] = [letters[swapIndex], letters[index]];
      }
      return letters.slice(0, 4);
    }

    function makeExpression(random, letters) {
      const operations = [
        { word: 'and' },
        { word: 'or' }
      ];
      const operation = () => choose(random, operations);
      const leaf = (letter) => ({ text: letter });
      const combine = (left, right) => {
        const connector = operation();
        return {
          text: `(${left.text} ${connector.word} ${right.text})`
        };
      };

      const leaves = letters.map(leaf);
      // The five possible binary-tree arrangements give the connectives varied grouping.
      switch (Math.floor(random() * 5)) {
        case 0: return combine(combine(combine(leaves[0], leaves[1]), leaves[2]), leaves[3]);
        case 1: return combine(combine(leaves[0], combine(leaves[1], leaves[2])), leaves[3]);
        case 2: return combine(combine(leaves[0], leaves[1]), combine(leaves[2], leaves[3]));
        case 3: return combine(leaves[0], combine(combine(leaves[1], leaves[2]), leaves[3]));
        default: return combine(leaves[0], combine(leaves[1], combine(leaves[2], leaves[3])));
      }
    }

    function generate(studentId) {
      const random = seededRandom(hashId(studentId));
      const letters = shuffledLetters(random);
      const expression = makeExpression(random, letters);
      expressionElement.textContent = expression.text;
      expressionElement.classList.remove('hidden');
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const studentId = input.value.trim();
      const isValid = studentId.length > 0;
      error.classList.toggle('hidden', isValid);
      if (isValid) generate(studentId);
    });
  })();
</script>
</body>
</html>
